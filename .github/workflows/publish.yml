name: Publish Maven

on:
  push:
    branches: [main]
    paths: ['**/gradle.properties']
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-maven
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Install the Java 8 doclet used for published Javadocs
        shell: bash
        run: |
          archive="$RUNNER_TEMP/zulu8.98.0.107-ca-jdk8.0.512-linux_x64.tar.gz"
          curl --fail --location --retry 3 "https://cdn.azul.com/zulu/bin/${archive##*/}" --output "$archive"
          # https://api.azul.com/metadata/v1/zulu/packages/e92d9f82-0d1d-4ed7-925c-ad30aaf45301
          echo "f82a4cb00bbac1ddaa4e578cd6221361a45ee0e4ce51969c4109451750e5164e  $archive" | sha256sum --check
          jdk="$RUNNER_TEMP/codev-zulu-8u512-b08"
          mkdir "$jdk"
          tar -xzf "$archive" --strip-components=1 -C "$jdk"
          echo "CODEV_JAVA_8=$jdk" >> "$GITHUB_ENV"

      - name: Set up Java 11 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '11.0.16'
          java-package: jdk+jcef

      # IDEA instrumentation was verified with JBR17, not arbitrary vendors.
      - name: Set up JBR 17 launcher
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '17.0.14'
          java-package: jdk+jcef

      - name: Set up Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4

      - name: Publish complete Maven tree
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Scratch Git admin cannot use checkout-local authentication.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${REPOSITORY_URL}.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          deno run --allow-read --allow-write --allow-env --allow-run \
              .github/publish-maven.ts \
              "$SOURCE_REF" "$SOURCE_SHA" "$REPOSITORY_URL"
